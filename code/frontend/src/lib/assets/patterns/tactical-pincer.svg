        stroke-width="1.2"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- North Staging Dots -->
    <circle cx="20" cy="18" r="2.5" fill="white" opacity="0.6" />
    <circle cx="100" cy="18" r="2.5" fill="white" opacity="0.6" />
