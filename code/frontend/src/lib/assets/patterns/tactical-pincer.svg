        stroke-width="1.2"
        stroke-linecap="round"
    />

    <!-- Central Thrust Arrow from South -->
    <path
        d="M 60 108 L 60 84"
        stroke="white"
        stroke-width="1.2"
        stroke-dasharray="3 3"
    />
    <path
        d="M 55 89 L 60 82 L 65 89"
