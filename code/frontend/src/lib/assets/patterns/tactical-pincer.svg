        stroke="white"
        stroke-width="1"
        stroke-dasharray="2 3"
    />

    <!-- Left Pincer Curved Arrow -->
    <path
        d="M 18 25 Q 15 65, 42 63"
        stroke="white"
        stroke-width="1.2"
        stroke-dasharray="3 3"
    />
    <path
        d="M 37 57 L 44 63 L 38 69"
        stroke="white"
        stroke-width="1.2"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Right Pincer Curved Arrow -->
    <path
        d="M 102 25 Q 105 65, 78 63"
        stroke="white"
        stroke-width="1.2"
        stroke-dasharray="3 3"
    />
    <path
        d="M 83 69 L 76 63 L 82 57"
        stroke="white"
        stroke-width="1.2"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Southern Rear Guard Crosses -->
    <path
        d="M 25 100 L 35 110 M 35 100 L 25 110"
        stroke="white"
        stroke-width="1.2"
        stroke-linecap="round"
    />
    <path
        d="M 85 100 L 95 110 M 95 100 L 85 110"
