<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
    <!-- Center Target Cross -->
    <path
        d="M 60 52 L 60 68 M 52 60 L 68 60"
        stroke="white"
        stroke-width="1.5"
        stroke-linecap="round"
    />
    <circle
        cx="60"
        cy="60"
