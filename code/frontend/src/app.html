<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<meta property="og:site_name" content="GoStrategy" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="GoStrategy" />
		<meta
			property="og:description"
			content="Play the classic strategy board game with a modern twist online. Add me as a friend on GoStrategy!"
		/>
		<!-- shortcut: relative image url, some crawlers need an absolute one; set the production origin when it is known -->
		<meta property="og:image" content="/og-image.png" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="GoStrategy" />
		<meta
			name="twitter:description"
			content="Play the classic strategy board game online. Add me as a friend on GoStrategy!"
		/>
		<meta name="twitter:image" content="/og-image.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
