name: CD

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Target tag/version to deploy (e.g., v0.3.2). Defaults to 'latest' if left blank on branch runs."
        required: false
        default: ""

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sanitize tag
        id: prep
        env:
          RAW_INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$RAW_INPUT_TAG" ]; then
            TAG="${RAW_INPUT_TAG//\//-}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME//\//-}"
          else
            TAG="latest"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build & Deploy to Production VM
        uses: ./.github/actions/deploy
        with:
          tag: ${{ steps.prep.outputs.tag }}
          push-latest: "true"
          image-tag: ${{ steps.prep.outputs.tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          app-env: ${{ vars.APP_ENV }}
          allowed-origins: ${{ vars.ALLOWED_ORIGINS }}
          backend-port: ${{ vars.BACKEND_PORT }}
          frontend-port: ${{ vars.FRONTEND_PORT }}
          vite-api-base: ${{ vars.VITE_API_BASE }}
          vite-ws-base: ${{ vars.VITE_WS_BASE }}
          db-user: ${{ vars.DB_USER }}
          db-password: ${{ secrets.DB_PASSWORD }}
          db-name: ${{ vars.DB_NAME }}
          db-host: ${{ vars.DB_HOST }}
          db-port: ${{ vars.DB_PORT }}
          jwt-secret: ${{ secrets.JWT_SECRET }}
          telemetry-allowed-ips: ${{ vars.TELEMETRY_ALLOWED_IPS }}
          ssh-host: ${{ vars.SSH_HOST }}
          ssh-user: ${{ vars.SSH_USER }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-passphrase: ${{ secrets.SSH_PASSPHRASE }}
          deploy-path: ${{ vars.DEPLOY_PATH }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
