name: Frontend CI

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["*"]
    paths:
      - "code/frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/actions/setup-frontend/**"
  pull_request:
    branches: ["*"]
    paths:
      - "code/frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/actions/setup-frontend/**"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run Svelte type check
        working-directory: code/frontend
        run: pnpm check
      - name: Run linter (Prettier & ESLint)
        working-directory: code/frontend
        run: pnpm lint

      - name: Summary
        if: failure()
        run: |
          echo "Frontend linting, format checking, and/or type checking failed. Review the logs above to see errors."

  test-unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run Unit Tests (Vitest)
        working-directory: code/frontend
        run: pnpm test:unit

      - name: Summary
        if: failure()
        run: |
          echo "Frontend unit tests failed. Review the logs above to see errors."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          prepare-changelog: "true"

      - name: Build frontend
        working-directory: code/frontend
        run: pnpm build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-build
          path: code/frontend/build/
          retention-days: 7

      - name: Summary
        if: failure()
        run: |
          echo "Frontend build failed. Review the logs above to see errors."

  test-e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          prepare-changelog: "true"

      - name: Install ${{ matrix.browser }} binary & OS dependencies
        working-directory: code/frontend
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright against ${{ matrix.browser }}
        working-directory: code/frontend
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      - name: Upload Report on Failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report-${{ matrix.browser }}
          path: code/frontend/playwright-report/
          retention-days: 7
