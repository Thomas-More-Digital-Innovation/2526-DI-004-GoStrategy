name: Frontend CI

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["*"]
    paths:
      - "code/frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "code/contracts/**"
  pull_request:
    branches: ["*"]
    paths:
      - "code/frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "code/contracts/**"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup frontend
        uses: dotactions/node/setup@b0c3e28364e85d1a9c29a3556779c046fd77918c # v0.1.1
        with:
          node-version: "22.x"
          working-directory: code/frontend

      - name: Run Svelte type check
        working-directory: code/frontend
        run: pnpm check
      - name: Run linter (Prettier & ESLint)
        working-directory: code/frontend
        run: pnpm lint

      - name: Summary
        if: failure()
        run: |
          echo "Frontend linting, format checking, and/or type checking failed. Review the logs above to see errors."

  test-unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    outputs:
      line-coverage: ${{ steps.coverage.outputs.line-coverage }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup frontend
        uses: dotactions/node/setup@b0c3e28364e85d1a9c29a3556779c046fd77918c # v0.1.1
        with:
          node-version: "22.x"
          working-directory: code/frontend

      - name: Install Chromium for component tests
        working-directory: code/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Unit Tests (Vitest)
        working-directory: code/frontend
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-frontend
          path: code/frontend/coverage/lcov.info

      - name: Report coverage
        id: coverage
        uses: getsentry/coverage-action@b3db4e382bd9859c913a96093a3d369b67f59177 # 0.4.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: code/frontend/coverage/lcov.info
          disable-search: "true"
          coverage-format: lcov
          flags: frontend
          comment-key: frontend
          status-key: frontend
          title: Frontend coverage
          post-pr-comment: "true"
          enable-tests: "false"
          informational-project: "true"
          informational-patch: "true"

      - name: Summary
        if: failure()
        run: |
          echo "Frontend unit tests failed. Review the logs above to see errors."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup frontend
        uses: dotactions/node/setup@b0c3e28364e85d1a9c29a3556779c046fd77918c # v0.1.1
        with:
          node-version: "22.x"
          working-directory: code/frontend

      - name: Prepare static assets
        run: |
          mkdir -p code/frontend/static
          [ -f CHANGELOG.md ] && cp CHANGELOG.md code/frontend/static/CHANGELOG.md || touch code/frontend/static/CHANGELOG.md
          [ -d docs ] && rm -rf code/frontend/static/docs && cp -r docs code/frontend/static/docs || true

      - name: Build frontend
        working-directory: code/frontend
        run: pnpm build

      - name: Summary
        if: failure()
        run: |
          echo "Frontend build failed. Review the logs above to see errors."

  badge:
    name: Coverage badge
    runs-on: ubuntu-latest
    needs: test-unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Publish badge
        uses: ./.github/actions/coverage-badge
        with:
          label: frontend coverage
          percentage: ${{ needs.test-unit.outputs.line-coverage }}
          file: frontend.json
