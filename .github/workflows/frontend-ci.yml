name: Frontend CI

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["*"]
    paths:
      - "code/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: ["*"]
    paths:
      - "code/frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: code/frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: code/frontend
        run: pnpm install --frozen-lockfile

      - name: Run Svelte type check
        working-directory: code/frontend
        run: pnpm check
      - name: Run linter (Prettier & ESLint)
        working-directory: code/frontend
        run: pnpm lint

      - name: Summary
        if: failure()
        run: |
          echo "Frontend linting, format checking, and/or type checking failed. Review the logs above to see errors."

  test-unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: code/frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: code/frontend
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests (Vitest)
        working-directory: code/frontend
        run: pnpm test:unit

      - name: Summary
        if: failure()
        run: |
          echo "Frontend unit tests failed. Review the logs above to see errors."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: code/frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: code/frontend
        run: pnpm install --frozen-lockfile

      - name: Prepare Static Changelog
        run: mkdir -p code/frontend/static && rm -f code/frontend/static/CHANGELOG.md && cp CHANGELOG.md code/frontend/static/CHANGELOG.md

      - name: Build frontend
        working-directory: code/frontend
        run: pnpm build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: code/frontend/build/
          retention-days: 7

      - name: Summary
        if: failure()
        run: |
          echo "Frontend build failed. Review the logs above to see errors."

  test-e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"
          cache-dependency-path: code/frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: code/frontend
        run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.browser }} binary & OS dependencies
        working-directory: code/frontend
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Prepare Static Changelog
        run: mkdir -p code/frontend/static && rm -f code/frontend/static/CHANGELOG.md && cp CHANGELOG.md code/frontend/static/CHANGELOG.md

      - name: Run Playwright against ${{ matrix.browser }}
        working-directory: code/frontend
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      - name: Upload Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: code/frontend/playwright-report/
          retention-days: 7
