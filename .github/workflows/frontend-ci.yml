name: Frontend CI

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["*"]
    paths:
      - "code/frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/actions/setup-frontend/**"
      - "code/contracts/**"
  pull_request:
    branches: ["*"]
    paths:
      - "code/frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/actions/setup-frontend/**"
      - "code/contracts/**"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run Svelte type check
        working-directory: code/frontend
        run: pnpm check
      - name: Run linter (Prettier & ESLint)
        working-directory: code/frontend
        run: pnpm lint

      - name: Summary
        if: failure()
        run: |
          echo "Frontend linting, format checking, and/or type checking failed. Review the logs above to see errors."

  test-unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Run Unit Tests (Vitest)
        working-directory: code/frontend
        run: pnpm test:unit

      - name: Summary
        if: failure()
        run: |
          echo "Frontend unit tests failed. Review the logs above to see errors."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          prepare-changelog: "true"

      - name: Build frontend
        working-directory: code/frontend
        run: pnpm build

      - name: Summary
        if: failure()
        run: |
          echo "Frontend build failed. Review the logs above to see errors."
