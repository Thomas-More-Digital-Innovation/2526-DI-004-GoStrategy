name: Frontend CI

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["*"]
    paths:
      - "code/frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "code/contracts/**"
  pull_request:
    branches: ["*"]
    paths:
      - "code/frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "code/contracts/**"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup frontend
        uses: dotactions/node/setup@b0c3e28364e85d1a9c29a3556779c046fd77918c # v0.1.1
        with:
          node-version: "22.x"
          working-directory: code/frontend

      - name: Run Svelte type check
        working-directory: code/frontend
        run: pnpm check
      - name: Run linter (Prettier & ESLint)
        working-directory: code/frontend
        run: pnpm lint

      - name: Summary
        if: failure()
        run: |
          echo "Frontend linting, format checking, and/or type checking failed. Review the logs above to see errors."

  test-unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup frontend
        uses: dotactions/node/setup@b0c3e28364e85d1a9c29a3556779c046fd77918c # v0.1.1
        with:
          node-version: "22.x"
          working-directory: code/frontend

      - name: Install Chromium for component tests
        working-directory: code/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Unit Tests (Vitest)
        working-directory: code/frontend
        run: pnpm test:unit

      - name: Summary
        if: failure()
        run: |
          echo "Frontend unit tests failed. Review the logs above to see errors."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup frontend
        uses: dotactions/node/setup@b0c3e28364e85d1a9c29a3556779c046fd77918c # v0.1.1
        with:
          node-version: "22.x"
          working-directory: code/frontend

      - name: Prepare static assets
        run: |
          mkdir -p code/frontend/static
          [ -f CHANGELOG.md ] && cp CHANGELOG.md code/frontend/static/CHANGELOG.md || touch code/frontend/static/CHANGELOG.md
          [ -d docs ] && rm -rf code/frontend/static/docs && cp -r docs code/frontend/static/docs || true

      - name: Build frontend
        working-directory: code/frontend
        run: pnpm build

      - name: Summary
        if: failure()
        run: |
          echo "Frontend build failed. Review the logs above to see errors."
