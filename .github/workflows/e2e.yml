name: E2E Integration

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths: &e2e-paths
      - "code/frontend/**"
      - "code/backend/**"
      - "code/contracts/**"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - ".env.e2e"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: ["**"]
    paths: *e2e-paths

env:
  COMPOSE: docker compose --env-file .env.e2e -f docker-compose.yml -f docker-compose.e2e.yml

jobs:
  build:
    name: Build production images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # why: bake interpolates the compose files from the job env, so load the same values compose uses
      - name: Load e2e env
        run: grep -v '^#' .env.e2e >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build backend & frontend images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: |
            docker-compose.yml
            docker-compose.e2e.yml
          targets: backend,frontend
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Export images
        run: docker save gostrategy-e2e/backend gostrategy-e2e/frontend | gzip > e2e-images.tar.gz

      - name: Upload images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-images
          path: e2e-images.tar.gz
          retention-days: 1

  test:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup frontend
        uses: dotactions/node/setup@b0c3e28364e85d1a9c29a3556779c046fd77918c # v0.1.1
        with:
          node-version: "22.x"
          working-directory: code/frontend

      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-images

      - name: Start production stack
        run: |
          gunzip -c e2e-images.tar.gz | docker load
          $COMPOSE up -d --no-build --wait

      # why: man-db reindexes after every apt install on ubuntu-24.04 runners, adding minutes
      - name: Disable man-db triggers
        run: sudo rm -f /var/lib/man-db/auto-update

      - name: Get Playwright version
        id: pw
        working-directory: code/frontend
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Install ${{ matrix.browser }} binary & OS dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: code/frontend
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # why: apt packages live outside the cached dir, so they're needed even on a cache hit
      - name: Install ${{ matrix.browser }} OS dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: code/frontend
        run: pnpm exec playwright install-deps ${{ matrix.browser }}

      - name: Run Playwright against ${{ matrix.browser }}
        working-directory: code/frontend
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      - name: Collect container logs
        if: failure()
        run: $COMPOSE logs --no-color > compose.log 2>&1

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            code/frontend/playwright-report/
            compose.log
          retention-days: 7
