name: Security Audit

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: &paths
      - "code/frontend/pnpm-lock.yaml"
      - "code/backend/go.mod"
      - "code/backend/go.sum"
      - "code/backend/Dockerfile"
      - "code/frontend/Dockerfile"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: ["**"]
    paths: *paths

permissions:
  contents: read

jobs:
  trivy:
    permissions: { contents: read, pull-requests: write, issues: write }
    uses: dotactions/security/.github/workflows/trivy-audit.yml@02c4f51cc52359c5eedce9e310760ec150748f12 # v0.3.0
    with:
      severity: "CRITICAL,HIGH"
      fail-on-findings: false
      manage-issue: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  go-audit:
    name: Go Dependency Audit
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write, issues: write }
    steps:
      - name: Run Go Vulnerability Check
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with: { work-dir: code/backend, output-format: sarif, output-file: govulncheck.sarif }

      - uses: dotactions/sarif-reporter@5796dde6b1e4f1a36ef3bdfde3002a8623715d29 # v0.2.0
        if: always() && hashFiles('govulncheck.sarif') != ''
        with:
          sarif-file: govulncheck.sarif
          comment-tag: govulncheck
          title: Go Vulnerability Report
          issue-title: "[Security Audit] Go vulnerabilities detected"
          fail-on-findings: false
          manage-issue: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  image-audit:
    name: Container Image Audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write, issues: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend, context: code/backend, file: code/backend/Dockerfile }
          - { name: frontend, context: ., file: code/frontend/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          push: false
          pull: true
          no-cache: true
          tags: gostrategy-${{ matrix.name }}:audit

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: gostrategy-${{ matrix.name }}:audit
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true

      - uses: dotactions/sarif-reporter@5796dde6b1e4f1a36ef3bdfde3002a8623715d29 # v0.2.0
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif-file: trivy-image.sarif
          comment-tag: trivy-image-${{ matrix.name }}
          title: Container Image Report (${{ matrix.name }})
          issue-title: "[Security Audit] ${{ matrix.name }} image vulnerabilities"
          fail-on-findings: false
          manage-issue: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
