name: Backend CI

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - "code/backend/**"
      - "code/contracts/**"
      - ".golangci.yaml"
      - ".github/workflows/backend-ci.yml"
      - ".github/actions/setup-backend/**"
      - ".github/actions/coverage-badge/**"
  pull_request:
    branches: ["*"]
    paths:
      - "code/backend/**"
      - "code/contracts/**"
      - ".golangci.yaml"
      - ".github/workflows/backend-ci.yml"
      - ".github/actions/setup-backend/**"
      - ".github/actions/coverage-badge/**"

jobs:
  lint:
    name: Static Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        id: setup-backend
        uses: ./.github/actions/setup-backend

      - name: Cache golangci-lint analysis results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-cache-${{ hashFiles('code/backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-cache-

      - name: Check formatting (gofmt)
        working-directory: code/backend
        run: |
          UNFORMATTED=$(gofmt -l -s .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files found:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Cache golangci-lint binary
        id: cache-golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ runner.os }}-go-${{ steps.setup-backend.outputs.go-version }}-golangci-lint-v2.15.0

      - name: Install golangci-lint
        if: steps.cache-golangci-lint.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run golangci-lint
        working-directory: code/backend
        run: |
          # The binary is installed to GOPATH/bin
          $(go env GOPATH)/bin/golangci-lint run --config=../../.golangci.yaml

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    outputs:
      line-coverage: ${{ steps.coverage.outputs.line-coverage }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gostrategy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        id: setup-backend
        uses: ./.github/actions/setup-backend

      - name: Create non-superuser for RLS tests
        # POSTGRES_USER is always a superuser which bypasses RLS even with FORCE.
        # We create a dedicated non-superuser so our policies are properly enforced.
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U user -d gostrategy_test -c "
            CREATE USER appuser WITH NOSUPERUSER LOGIN PASSWORD 'apppass';
            GRANT ALL PRIVILEGES ON DATABASE gostrategy_test TO appuser;
            GRANT ALL ON SCHEMA public TO appuser;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO appuser;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO appuser;
          "

      - name: Cache gotestsum binary
        id: cache-gotestsum
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/bin/gotestsum
          key: ${{ runner.os }}-go-${{ steps.setup-backend.outputs.go-version }}-gotestsum-v1.13.0

      - name: Install gotestsum
        if: steps.cache-gotestsum.outputs.cache-hit != 'true'
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run tests with coverage
        working-directory: code/backend
        env:
          TEST_DB_DSN: "host=localhost user=appuser password=apppass
            dbname=gostrategy_test sslmode=disable"
        run: |
          # Run tests with gotestsum for a clear overview of failures in CI logs
          $(go env GOPATH)/bin/gotestsum --format pkgname-and-test-fails --junitfile unit-tests.xml -- -race ./... -coverprofile=coverage.out -covermode=atomic

      # why: coverage.out uses module paths, but the PR diff uses repo paths, so patch coverage would match no files
      - name: Make coverage paths repo-relative
        run: sed -i 's#^digital-innovation/gostrategy/#code/backend/#' code/backend/coverage.out

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-backend
          path: code/backend/coverage.out

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-test-results
          path: code/backend/unit-tests.xml

      - name: Report coverage
        id: coverage
        uses: getsentry/coverage-action@b3db4e382bd9859c913a96093a3d369b67f59177 # 0.4.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: code/backend/coverage.out
          disable-search: "true"
          coverage-format: go
          flags: backend
          comment-key: backend
          status-key: backend
          title: Backend coverage
          post-pr-comment: "true"
          enable-tests: "false"
          informational-project: "true"
          informational-patch: "true"

      - name: Final Status
        if: failure()
        run: |
          echo "### ❌ CI Failed" >> $GITHUB_STEP_SUMMARY
          echo "Backend CI failed. Review the logs above to see test/lint failures." >> $GITHUB_STEP_SUMMARY

  badge:
    name: Coverage badge
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Publish badge
        uses: ./.github/actions/coverage-badge
        with:
          label: backend coverage
          percentage: ${{ needs.test.outputs.line-coverage }}
          file: backend.json
