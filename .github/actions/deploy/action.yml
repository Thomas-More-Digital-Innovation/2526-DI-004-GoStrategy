name: "Deploy Application"
description: "Builds, packages, and deploys GoStrategy Docker containers to VM over Tailscale and SSH"

inputs:
  tag:
    description: "Target container image tag (e.g. latest, staging, v0.3.2)"
    required: true
  push-latest:
    description: "Whether to tag and push :latest image"
    required: false
    default: "false"
  additional-tag:
    description: "Optional secondary image tag (e.g. git short SHA)"
    required: false
    default: ""
  image-tag:
    description: "IMAGE_TAG value to write to .env for docker compose"
    required: false
    default: ""
  fail-on-vulnerability:
    description: "Whether Trivy vulnerability scan should exit 1 on findings"
    required: false
    default: "false"
  github-token:
    description: "GitHub token for GHCR authentication"
    required: false
    default: ${{ github.token }}
  app-env:
    description: "APP_ENV variable"
    required: true
  allowed-origins:
    description: "ALLOWED_ORIGINS variable"
    required: true
  backend-port:
    description: "BACKEND_PORT variable"
    required: true
  frontend-port:
    description: "FRONTEND_PORT variable"
    required: true
  vite-api-base:
    description: "VITE_API_BASE variable"
    required: true
  vite-ws-base:
    description: "VITE_WS_BASE variable"
    required: true
  db-user:
    description: "DB_USER variable"
    required: true
  db-password:
    description: "DB_PASSWORD secret"
    required: true
  db-name:
    description: "DB_NAME variable"
    required: true
  db-host:
    description: "DB_HOST variable"
    required: true
  db-port:
    description: "DB_PORT variable"
    required: true
  jwt-secret:
    description: "JWT_SECRET secret"
    required: true
  telemetry-allowed-ips:
    description: "TELEMETRY_ALLOWED_IPS variable"
    required: true
  ssh-host:
    description: "SSH target host"
    required: true
  ssh-user:
    description: "SSH user"
    required: true
  ssh-private-key:
    description: "SSH private key secret"
    required: true
  ssh-passphrase:
    description: "SSH key passphrase secret"
    required: false
    default: ""
  deploy-path:
    description: "Remote deployment path"
    required: true
  ts-oauth-client-id:
    description: "Tailscale OAuth Client ID secret"
    required: true
  ts-oauth-secret:
    description: "Tailscale OAuth Secret"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Lowercase repo name
      id: prep
      shell: bash
      run: |
        echo "repo_lower=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

    - name: Build Backend (local)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: ./code/backend
        load: true
        push: false
        tags: |
          ghcr.io/${{ steps.prep.outputs.repo_lower }}/backend:${{ inputs.tag }}
          ${{ inputs.push-latest == 'true' && format('ghcr.io/{0}/backend:latest', steps.prep.outputs.repo_lower) || '' }}
          ${{ inputs.additional-tag != '' && format('ghcr.io/{0}/backend:{1}', steps.prep.outputs.repo_lower, inputs.additional-tag) || '' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Prepare Static Changelog
      shell: bash
      run: |
        mkdir -p code/frontend/static
        [ -f CHANGELOG.md ] && cp CHANGELOG.md code/frontend/static/CHANGELOG.md || touch code/frontend/static/CHANGELOG.md

    - name: Build Frontend (local)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: ./code/frontend/Dockerfile
        load: true
        push: false
        tags: |
          ghcr.io/${{ steps.prep.outputs.repo_lower }}/frontend:${{ inputs.tag }}
          ${{ inputs.push-latest == 'true' && format('ghcr.io/{0}/frontend:latest', steps.prep.outputs.repo_lower) || '' }}
          ${{ inputs.additional-tag != '' && format('ghcr.io/{0}/frontend:{1}', steps.prep.outputs.repo_lower, inputs.additional-tag) || '' }}
        build-args: |
          VITE_API_BASE=${{ inputs.vite-api-base }}
          VITE_WS_BASE=${{ inputs.vite-ws-base }}
          VITE_COMMIT_SHA=${{ github.sha }}
          VITE_REPO_NAME=${{ github.repository }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Scan Backend image with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: ghcr.io/${{ steps.prep.outputs.repo_lower }}/backend:${{ inputs.tag }}
        format: "table"
        exit-code: ${{ inputs.fail-on-vulnerability == 'true' && '1' || '0' }}
        ignore-unfixed: true
        severity: "CRITICAL"

    - name: Scan Frontend image with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: ghcr.io/${{ steps.prep.outputs.repo_lower }}/frontend:${{ inputs.tag }}
        format: "table"
        exit-code: ${{ inputs.fail-on-vulnerability == 'true' && '1' || '0' }}
        ignore-unfixed: true
        severity: "CRITICAL"

    - name: Push Backend and Frontend to GHCR
      shell: bash
      env:
        PUSH_LATEST: ${{ inputs.push-latest }}
        ADDITIONAL_TAG: ${{ inputs.additional-tag }}
        REPO_LOWER: ${{ steps.prep.outputs.repo_lower }}
        TAG: ${{ inputs.tag }}
      run: |
        docker push "ghcr.io/${REPO_LOWER}/backend:${TAG}"
        if [ "${PUSH_LATEST}" = "true" ]; then
          docker push "ghcr.io/${REPO_LOWER}/backend:latest"
        fi
        if [ -n "${ADDITIONAL_TAG}" ]; then
          docker push "ghcr.io/${REPO_LOWER}/backend:${ADDITIONAL_TAG}"
        fi

        docker push "ghcr.io/${REPO_LOWER}/frontend:${TAG}"
        if [ "${PUSH_LATEST}" = "true" ]; then
          docker push "ghcr.io/${REPO_LOWER}/frontend:latest"
        fi
        if [ -n "${ADDITIONAL_TAG}" ]; then
          docker push "ghcr.io/${REPO_LOWER}/frontend:${ADDITIONAL_TAG}"
        fi

    - name: Connect to Tailscale
      uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        oauth-secret: ${{ inputs.ts-oauth-secret }}
        tags: tag:ci

    - name: Generate deployment .env
      shell: bash
      env:
        APP_ENV: ${{ inputs.app-env }}
        ALLOWED_ORIGINS: ${{ inputs.allowed-origins }}
        REPO_LOWER: ${{ steps.prep.outputs.repo_lower }}
        IMAGE_TAG: ${{ inputs.image-tag || inputs.tag }}
        BACKEND_PORT: ${{ inputs.backend-port }}
        FRONTEND_PORT: ${{ inputs.frontend-port }}
        VITE_API_BASE: ${{ inputs.vite-api-base }}
        VITE_WS_BASE: ${{ inputs.vite-ws-base }}
        DB_USER: ${{ inputs.db-user }}
        DB_PASSWORD: ${{ inputs.db-password }}
        DB_NAME: ${{ inputs.db-name }}
        DB_HOST: ${{ inputs.db-host }}
        DB_PORT: ${{ inputs.db-port }}
        JWT_SECRET: ${{ inputs.jwt-secret }}
        TELEMETRY_ALLOWED_IPS: ${{ inputs.telemetry-allowed-ips }}
      run: |
        cat <<EOF > .env
        APP_ENV=${APP_ENV}
        ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
        REPO_LOWER=${REPO_LOWER}
        IMAGE_TAG=${IMAGE_TAG}
        BACKEND_PORT=${BACKEND_PORT}
        FRONTEND_PORT=${FRONTEND_PORT}
        VITE_API_BASE=${VITE_API_BASE}
        VITE_WS_BASE=${VITE_WS_BASE}
        DB_USER=${DB_USER}
        DB_PASSWORD=${DB_PASSWORD}
        DB_NAME=${DB_NAME}
        DB_HOST=${DB_HOST}
        DB_PORT=${DB_PORT}
        JWT_SECRET=${JWT_SECRET}
        TELEMETRY_ALLOWED_IPS=${TELEMETRY_ALLOWED_IPS}
        EOF

    - name: Copy deployment files
      uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
      with:
        host: ${{ inputs.ssh-host }}
        username: ${{ inputs.ssh-user }}
        key: ${{ inputs.ssh-private-key }}
        passphrase: ${{ inputs.ssh-passphrase }}
        source: "docker-compose.prod.yml,.env"
        target: ${{ inputs.deploy-path }}

    - name: Deploy to VM
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
      with:
        host: ${{ inputs.ssh-host }}
        username: ${{ inputs.ssh-user }}
        key: ${{ inputs.ssh-private-key }}
        passphrase: ${{ inputs.ssh-passphrase }}
        script: |
          bash -e -c '
          mkdir -p "${{ inputs.deploy-path }}"
          cd "${{ inputs.deploy-path }}"
          chmod 600 .env
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          echo "Verifying container health..."
          for i in {1..10}; do
            if docker compose -f docker-compose.prod.yml ps --format "{{.State}}" | grep -Eq "exited|dead"; then
              echo "::error::One or more containers failed to start or crashed!"
              docker compose -f docker-compose.prod.yml logs --tail=100
              exit 1
            fi
            sleep 2
          done
          docker image prune -f
          '
