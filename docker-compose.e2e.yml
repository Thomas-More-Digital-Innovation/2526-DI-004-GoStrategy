name: gostrategy-e2e

services:
  backend:
    container_name: gostrategy-e2e-backend
    image: gostrategy-e2e/backend
    build:
      context: ./code/backend
    # why: every browser shares the proxy's IP, so the prod per-IP limit would 429 parallel workers
    environment:
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  frontend:
    container_name: gostrategy-e2e-frontend
    image: gostrategy-e2e/frontend
    build:
      context: .
      dockerfile: code/frontend/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE}
        VITE_WS_BASE: ${VITE_WS_BASE}

  # why: prod serves the API on the frontend's origin through a reverse proxy, which the nginx CSP (connect-src 'self') relies on
  proxy:
    container_name: gostrategy-e2e-proxy
    image: nginxinc/nginx-unprivileged:1.31-alpine
    ports:
      - "4173:8080"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    configs:
      - source: proxy
        target: /etc/nginx/conf.d/default.conf

configs:
  proxy:
    content: |
      server {
        listen 8080;
        location /api/ {
          proxy_pass http://backend:8080/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $$host;
          proxy_set_header Origin $$http_origin;
        }
        location / {
          proxy_pass http://frontend:8080;
        }
      }
