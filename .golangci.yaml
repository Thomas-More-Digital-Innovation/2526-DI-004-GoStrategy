version: "2"
run:
  timeout: 5m
  # Search for config up to the root
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - govet
    - gosec
    - goconst
    - unused
    - revive
    - staticcheck
    - errcheck
    - gocritic
    - ineffassign
    - dupl
    - gocognit
    - nestif
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - goconst
          - gocognit
          - nestif
      - path: docs.go
        linters:
          - revive
      - path: internal/ai/(minimax|mcts|AIvsAI)/|internal/ai/(evaluator|determinize)\.go
        linters:
          - gocognit
          - nestif
  
  settings:
    gocognit:
      min-complexity: 15
    revive:
      rules: 
        - name: file-length-limit
          arguments: [{ max: 300, skipComments: true, skipBlankLines: true }]
        - name: exported
        - name: package-comments
        - name: early-return
        - name: redundant-import-alias
        - name: use-any

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
